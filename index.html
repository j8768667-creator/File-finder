<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VibeStash</title>
  <style>
    :root {
      --bg: #0d0914;
      --card-bg: #191226;
      --card-border: #2b2042;
      --pink: #ff2a85;
      --pink-glow: rgba(255, 42, 133, 0.35);
      --cyan: #00e5ff;
      --yellow: #ffb703;
      --purple: #9d4edd;
      --text-main: #f5f5f7;
      --text-muted: #8b829e;
      --nav-bg: #120c1f;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Screen containers */
    .screen {
      display: none;
      flex: 1;
      height: calc(100vh - 70px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 20px 80px 20px;
    }
    .screen.active {
      display: block;
    }

    /* Header & Branding */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Metric Counters */
    .metrics-bar {
      display: flex;
      gap: 36px;
      margin: 18px 0 24px 0;
    }
    .metric-item h2 {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
    }
    .metric-item span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--pink);
      text-transform: uppercase;
    }

    /* Filters / Pills */
    .pill-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 16px;
    }
    .pill-scroller::-webkit-scrollbar { display: none; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e1530;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active {
      background: rgba(255, 42, 133, 0.15);
      border-color: var(--pink);
      color: #fff;
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* Import Banner Button */
    .import-card {
      border: 1.5px dashed var(--pink);
      background: rgba(255, 42, 133, 0.04);
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .import-card h4 {
      font-size: 15px;
      color: #fff;
      margin-bottom: 4px;
    }
    .import-card p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Grid & Cards */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .cue-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      position: relative;
      cursor: pointer;
    }
    .cue-card.selected {
      border-color: var(--pink);
      background: #231636;
    }
    .cue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .flame-icon {
      width: 16px;
      height: 16px;
      fill: var(--pink);
    }
    .cue-length {
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(0, 229, 255, 0.1);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .waveform-canvas {
      width: 100%;
      height: 38px;
      display: block;
      margin: 8px 0;
    }
    .cue-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cue-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Search Input */
    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .search-wrap input {
      width: 100%;
      background: #1b122c;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px 12px 38px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 13px;
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    /* Range Sliders */
    .control-cell {
      background: #140d21;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .control-header span:last-child {
      color: var(--pink);
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      background: #271a3d;
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--pink);
      margin-top: -6.5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* Studio Rack Area */
    .studio-preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .studio-screen {
      background: #100a1c;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin: 14px 0;
    }
    .studio-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-pink {
      background: linear-gradient(135deg, var(--pink), #d81159);
      color: #fff;
      box-shadow: 0 4px 14px var(--pink-glow);
    }
    .btn-gray {
      background: #261a38;
      border: 1px solid var(--card-border);
      color: #fff;
    }

    /* Bottom Tab Navigation Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--nav-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 999;
    }
    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--pink);
    }
    .tab-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    #file-importer { display: none; }
  </style>
</head>
<body>

      <div class="pill">PERCUSSION</div>
      <div class="pill">AMBIENT</div>
    </div>

      <div class="control-header">

        <span id="label-filter-len">0ms - 5.0s</span>
