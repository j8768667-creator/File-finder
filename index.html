<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VibeStash - Audio & MIDI Workstation</title>
  <style>
    :root {
      --bg-main: #0c0814;
      --bg-card: #181126;
      --bg-card-hover: #221836;
      --pink: #ff2a85;
      --pink-glow: rgba(255, 42, 133, 0.4);
      --cyan: #00e5ff;
      --yellow: #ffb703;
      --purple: #9d4edd;
      --text-main: #f0f0f5;
      --text-muted: #837b9b;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
    }

    /* Prevent double-tap zoom specifically on iOS Safari */
    body {
      touch-action: none;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* App Shell Layout */
    #app-container {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Screen Sections */
    .screen-panel {
      display: none;
      flex: 1;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 16px 24px 90px 24px;
    }

    .screen-panel.active {
      display: block;
    }

    /* Header Common */
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Stats Counters */
    .stat-row {
      display: flex;
      gap: 28px;
      margin: 16px 0;
    }

    .stat-item h3 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .stat-item span {
      font-size: 10px;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Tags & Pills */
    .pill-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px 0;
      scrollbar-width: none;
    }
    .pill-group::-webkit-scrollbar { display: none; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #1e162f;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: rgba(255, 42, 133, 0.2);
      border-color: var(--pink);
      color: #fff;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Search Bar */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

      width: 100%;
      background: #171126;
      border: 1px solid var(--border-subtle);
      border-radius: 12px
